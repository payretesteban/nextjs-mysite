# Checks every push and pull request: lint, type check and the test suite.
# The result shows as a ✓ or ✗ next to each commit on GitHub (and in GitHub Desktop's history).
name: Checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
